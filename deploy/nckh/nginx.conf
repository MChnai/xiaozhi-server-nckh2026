server {
    listen 8002;
    server_name _;
    client_max_body_size 16m;
    root /usr/share/nginx/html;
    resolver 127.0.0.11 valid=10s ipv6=off;
    location / { try_files $uri $uri/ /index.html; }
    location = /healthz { default_type text/plain; return 200 "Web Robot AI v3 đang hoạt động\n"; }
    location = /index.html { add_header Cache-Control "no-cache"; }
    location = /service-worker.js { add_header Cache-Control "no-cache"; }
    location /xiaozhi/ {
        set $api_upstream http://api:8003;
        proxy_pass $api_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 200s;
    }
    location /nckhsv/ { rewrite ^/nckhsv/(.*)$ /xiaozhi/$1 last; }
    location = /voice/healthz {
        set $voice_upstream http://voice:8003;
        proxy_pass $voice_upstream/healthz;
        proxy_read_timeout 5s;
    }
    location /mcp/vision/ {
        set $voice_upstream http://voice:8003;
        proxy_pass $voice_upstream$request_uri;
        proxy_set_header Host $http_host;
        proxy_read_timeout 200s;
    }
}
